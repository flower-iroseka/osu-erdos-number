<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">

{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <!--
      This overrides the theme's layout to drop its title banner. The heading
      here is the name of the top mapper, which changes with the mode and again
      every time the data is refreshed, so it cannot come from _config.yml.
      That also means the site title still has to be set there, for the tab.
    -->
    <header class="page-header" role="banner">
      <div class="erdos-head">
        <h1 id="erdos-title"><span id="top-name">&hellip;</span> number</h1>
        <div class="mode-picker">
          <button type="button" id="mode-button" aria-haspopup="listbox" aria-expanded="false" aria-label="Game mode"><span id="mode-icon"></span><span class="caret">&#9662;</span></button>
          <ul id="mode-menu" role="listbox" hidden></ul>
        </div>
        <p id="top-note"></p>
      </div>

      <p class="page-subtitle">How many handshakes away from the mapper who participated in the most ranked beatmaps?</p>

      <div class="query">
        <input id="mapper-input" type="text" placeholder="user id or username" autocomplete="off" spellcheck="false" aria-label="user id or username">
        <button type="button" id="go" aria-label="Go">&#9654;</button>
      </div>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-owner"><a href="https://github.com/flower-iroseka/osu-erdos-number">osu-erdos-number</a></span>
        <span class="site-footer-credits">This page was generated by <a href="https://pages.github.com">GitHub Pages</a>.</span>
      </footer>
    </main>
  </body>
</html>
