name: update graph

# Weekly, plus a fuller sweep every January and July.
#
# The weekly run stops as soon as it reaches a beatmapset it already has, so it
# only picks up what has been ranked since last time -- a dozen or so requests.
# That cannot see mapsets that were unranked, moved to the graveyard or deleted,
# which is what the twice-a-year full run is for.
#
# The cron fires every week for good; the "whether this run is due" step below
# is what drops the ones that are too soon once the schedule goes fortnightly.
# A cron cannot change its own interval partway through, so the interval lives
# in that step instead of here.
#
# GitHub disables scheduled workflows in repositories with no activity for 60
# days. The "keep the schedule alive" step pushes a dated file to main every
# run so that cannot happen; see the note there for why the data branch alone
# is not trusted to count.

on:
  schedule:
    - cron: "23 4 * * 1"     # every Monday: incremental
    - cron: "41 4 3 1,7 *"   # January and July: full
  workflow_dispatch:
    inputs:
      full:
        description: Collect every ranked beatmapset instead of only the new ones
        type: boolean
        default: false

permissions:
  contents: write

# Two runs pushing the data branch at once would race, and whichever finished
# last would publish a store missing the other one's mapsets.
concurrency:
  group: update-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
      OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No pip install: scripts/ is standard library only, on purpose.

      - name: Restore the store from the data branch
        run: |
          set -euo pipefail
          mkdir -p data out

          # ls-remote exits 2 when the ref simply is not there, and something
          # else when it could not look. Those need telling apart: treating a
          # network failure as "no store" would quietly re-collect everything.
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null 2>&1
          code=$?
          set -e

          if [ "$code" -eq 2 ]; then
            echo "no data branch yet, collecting from nothing"
            exit 0
          elif [ "$code" -ne 0 ]; then
            echo "could not ask whether the data branch exists (exit $code)" >&2
            exit "$code"
          fi

          git fetch --depth=1 origin data
          # users.json carries names for people who may have since renamed or
          # been banned, so it is kept alongside the store rather than rebuilt.
          # meta.json is pulled only so the check further down can compare this
          # build with the one on the branch.
          for file in beatsets.json users.json meta.json; do
            if git cat-file -e "FETCH_HEAD:$file" 2>/dev/null; then
              git show "FETCH_HEAD:$file" > "data/$file"
              echo "restored data/$file ($(wc -c < "data/$file") bytes)"
            else
              echo "data/$file is not on the branch yet"
            fi
          done

      - name: Decide how much to collect
        id: mode
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            full="${{ inputs.full }}"
          elif [ "${{ github.event.schedule }}" = "41 4 3 1,7 *" ]; then
            full="true"
          else
            full="false"
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "full collection: $full"

      # Weekly to begin with, fortnightly once the date below has passed. The
      # cron keeps firing every week either way, and this is what turns the
      # extra firings into a no-op -- a cron cannot change its own interval
      # partway through.
      #
      # It measures from the stamp inside the published meta.json, so it needs
      # no state of its own: if the store is ever lost, the next run just
      # happens, which is the safe way to be wrong.
      #
      # A full run is always due. There are only two a year and they are the
      # ones that clear out mapsets that stopped being ranked.
      - name: Decide whether this run is due
        id: due
        env:
          FULL: ${{ steps.mode.outputs.full }}
          WEEKLY_UNTIL: "2027-09-26"
          INTERVAL_DAYS: "14"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          if os.environ["FULL"] == "true":
              print("full collection, always due")
              due = True
          else:
              stamp = None
              previous = Path("data/meta.json")
              if previous.is_file():
                  stamp = json.loads(previous.read_text(encoding="utf-8")).get("generated")

              now = datetime.now(timezone.utc)
              cutover = datetime.fromisoformat(os.environ["WEEKLY_UNTIL"]).replace(tzinfo=timezone.utc)

              if stamp is None:
                  print("nothing published yet, running")
                  due = True
              elif now < cutover:
                  print(f"still weekly until {cutover.date()}, running")
                  due = True
              else:
                  age = (now - datetime.fromisoformat(stamp.replace("Z", "+00:00"))).days
                  interval = int(os.environ["INTERVAL_DAYS"])
                  due = age >= interval
                  print(f"fortnightly since {cutover.date()}: last build was {age} days ago, "
                        f"{'running' if due else f'not due for another {interval - age}'}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"due={'true' if due else 'false'}\n")
          PY

      - name: Collect from the osu! API
        if: steps.due.outputs.due == 'true'
        env:
          FULL: ${{ steps.mode.outputs.full }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            python scripts/fetch_beatsets.py --out data/beatsets.json --full
          else
            python scripts/fetch_beatsets.py --out data/beatsets.json
          fi

      - name: Build the graph
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          python scripts/build_graph.py \
            --store data/beatsets.json \
            --user-cache data/users.json \
            --out out \
            --fetch-usernames

      # Printed before the push so the numbers survive a failed publish.
      - name: Report sizes
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          store = json.loads(Path("data/beatsets.json").read_text(encoding="utf-8"))
          diffs = sum(len(d) for _host, d in store["sets"].values())
          print(f"store: {len(store['sets'])} beatmapsets, {diffs} difficulties, "
                f"{Path('data/beatsets.json').stat().st_size / 1e6:.1f} MB")
          print(f"store last written: {store['generated']}")

          for name in ("graph.json", "meta.json"):
              path = Path("out") / name
              print(f"{name}: {path.stat().st_size / 1e6:.2f} MB")
          PY

      # The publish step below replaces the data branch outright, so a build
      # that came out badly would go live with nothing to catch it: the job
      # would succeed, the site would keep working, and the only sign would be
      # numbers that are wrong. This is the one place that can notice.
      - name: Check the build against the last one
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          new = json.loads(Path("out/meta.json").read_text(encoding="utf-8"))["counts"]
          print(f"this run: {new['sets']} beatmapsets, {new['mappers']} mappers, "
                f"{new['edges']} edges")

          previous = Path("data/meta.json")
          if not previous.is_file():
              print("no meta.json on the data branch yet, nothing to compare")
              raise SystemExit(0)

          old = json.loads(previous.read_text(encoding="utf-8")).get("counts")
          if not old:
              print("the meta.json on the branch predates this check, nothing to compare")
              raise SystemExit(0)

          print(f"last run: {old['sets']} beatmapsets, {old['mappers']} mappers, "
                f"{old['edges']} edges")

          # Incremental runs only ever add. A full run rebuilds the store from
          # scratch, so it can lose sets that were unranked or deleted in the
          # meantime -- but half a year of that is nowhere near five percent.
          TOLERANCE = 0.95
          problems = []

          if new["sets"] == 0:
              problems.append("collected no beatmapsets at all")

          for key in ("sets", "mappers"):
              if old[key] and new[key] < old[key] * TOLERANCE:
                  drop = 100 * (1 - new[key] / old[key])
                  problems.append(f"{key} fell from {old[key]} to {new[key]} ({drop:.1f}% down)")

          for line in problems:
              print(f"::error::{line}")

          if problems:
              print("not publishing: the store or the collector needs looking at first")
              raise SystemExit(1)

          print(f"within {TOLERANCE:.0%} of the last run")
          PY

      - uses: actions/upload-artifact@v7
        if: steps.due.outputs.due == 'true'
        with:
          name: graph
          path: |
            out/graph.json
            out/meta.json
            out/users.csv
            out/users-*.csv
          retention-days: 30

      # The data branch is a single orphan commit that gets replaced every run,
      # so it never accumulates history. Only the newest store matters; the old
      # ones are dead weight that would grow without bound.
      #
      # users.csv rides along for reading by hand. Nothing loads it at runtime.
      - name: Publish to the data branch
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp data/beatsets.json data/users.json "$stage/"
          cp out/graph.json out/meta.json out/users.csv "$stage/"
          # Listed one by one rather than as users-*.csv, so a missing table says
          # which one instead of failing on the glob.
          cp out/users-osu.csv out/users-taiko.csv \
             out/users-fruits.csv out/users-mania.csv "$stage/"

          cd "$stage"
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update the graph ($(date -u +%Y-%m-%d))"

          # The token is in the URL because this is a fresh repository with no
          # remote of its own. GITHUB_TOKEN is masked in the log either way.
          git push --force --quiet \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:data

          echo "published $(git rev-parse --short HEAD) to the data branch"

      # GitHub disables a scheduled workflow once the repository has gone 60
      # days without activity, and it does not say whether commits to a
      # non-default branch count -- the data branch push above may or may not
      # be enough to hold it off. Every run also commits a dated file to main,
      # which counts under either reading. It costs one tiny commit, and the
      # alternative is the schedule going quiet with nothing to notice it.
      #
      # This runs after the publish on purpose: if it fails, the data is
      # already out and the red job is a nudge rather than a lost update.
      - name: Keep the schedule alive
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          mkdir -p .github
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/last-updated.txt
          git add .github/last-updated.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Note the data update ($(date -u +%Y-%m-%d))"

          # Somebody may have pushed to main while this ran, so the first push
          # can be rejected. Rebase onto whatever is there and try again.
          for attempt in 1 2 3; do
            if git push --quiet origin HEAD:main; then
              echo "pushed $(git rev-parse --short HEAD) to main on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt, rebasing onto the latest main"
            git fetch --quiet --depth=1 origin main
            git rebase --quiet FETCH_HEAD || { git rebase --abort; exit 1; }
          done

          echo "could not push the keepalive commit after three attempts" >&2
          exit 1
