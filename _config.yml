title: osu! erdős
description: How many handshakes away from the mapper who participated in the most ranked beatmaps?

remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

# Where the monthly workflow pushes the graph. It lives here so index.md and
# anything else that needs it cannot drift apart.
graph_url: https://raw.githubusercontent.com/flower-iroseka/osu-erdos-number/data/graph.json

# Jekyll copies everything it is not told to skip into the published site.
# `data` and `out` never reach the repo (they live on the data branch), but
# listing them keeps a local build the same shape as the deployed one.
exclude:
  - scripts
  - data
  - out
  - README.md
  - LICENSE
